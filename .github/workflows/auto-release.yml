name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install svu
        env:
          SVU_VERSION: "3.4.0"
        run: |
          curl -fsSL "https://github.com/caarlos0/svu/releases/download/v${SVU_VERSION}/svu_${SVU_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin svu

      - name: Detect version bump
        id: version
        run: |
          CURRENT=$(svu current)
          NEXT=$(svu next)

          if [ "$CURRENT" != "$NEXT" ]; then
            echo "next=$NEXT" >> "$GITHUB_OUTPUT"
            echo "Version bump: $CURRENT → $NEXT"
          else
            PATCH_TYPES="^(refactor|docs|chore|test|ci|build)(\(.+\))?!?:"
            COMMITS_SINCE=$(git log "${CURRENT}..HEAD" --format=%s --no-merges)
            QUALIFYING=$(echo "$COMMITS_SINCE" | grep -cE "$PATCH_TYPES" || true)

            if [ "$QUALIFYING" -gt 0 ]; then
              CURRENT_BARE="${CURRENT#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_BARE"
              NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "next=$NEXT" >> "$GITHUB_OUTPUT"
              echo "Patch bump (non-feat/fix): $CURRENT → $NEXT"
            else
              echo "No version bump detected ($CURRENT)"
            fi
          fi

      - name: Create tag
        if: steps.version.outputs.next
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"

      - name: Trigger release build
        if: steps.version.outputs.next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.next }}
        run: gh workflow run release.yml --ref "$TAG_NAME"
