name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install svu
        env:
          SVU_VERSION: "3.4.0"
          SVU_SHA256: "f9fe4f0edb7d8cf4b0ecd84dd8ffa7e36186da6c701ab5fa59cb75a100a1705e"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/caarlos0/svu/releases/download/v${SVU_VERSION}/svu_${SVU_VERSION}_linux_amd64.tar.gz" -o /tmp/svu.tar.gz
          echo "${SVU_SHA256}  /tmp/svu.tar.gz" | sha256sum -c -
          tar xz -C /usr/local/bin svu < /tmp/svu.tar.gz
          svu --version

      - name: Detect version bump
        id: version
        run: |
          set -euo pipefail

          CURRENT=$(svu current)
          NEXT=$(svu next)
          echo "svu current=$CURRENT next=$NEXT"

          if [ -z "$CURRENT" ] || [ -z "$NEXT" ]; then
            echo "::error::svu returned empty version (current='$CURRENT', next='$NEXT')"
            exit 1
          fi

          if [ "$CURRENT" != "$NEXT" ]; then
            echo "Version bump: $CURRENT → $NEXT"
          else
            COMMITS_SINCE=$(git log "${CURRENT}..HEAD" --format=%s --no-merges)
            if [ -z "$COMMITS_SINCE" ]; then
              echo "::notice::No commits since $CURRENT, skipping release"
              echo "## No release needed" >> "$GITHUB_STEP_SUMMARY"
              echo "No new commits since \`$CURRENT\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Patch-bump types: everything except feat/fix (handled by svu) and breaking changes (!)
            # Keep in sync with allowed types in CLAUDE.md
            PATCH_TYPES="^(refactor|docs|chore|test|ci|build)(\(.+\))?:"
            QUALIFYING=$(echo "$COMMITS_SINCE" | grep -cE "$PATCH_TYPES" || true)

            if [ "$QUALIFYING" -gt 0 ]; then
              CURRENT_BARE="${CURRENT#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_BARE"
              NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "Patch bump (non-feat/fix): $CURRENT → $NEXT"
            else
              echo "::notice::No version bump detected ($CURRENT)"
              echo "## No release needed" >> "$GITHUB_STEP_SUMMARY"
              echo "No conventional commit types found since \`$CURRENT\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if ! [[ "$NEXT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$NEXT' does not match semver pattern"
            exit 1
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: tag
        if: steps.version.outputs.next
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if [ -n "$(git tag -l "$NEXT_VERSION")" ]; then
            echo "::warning::Tag $NEXT_VERSION already exists, skipping tag creation"
            echo "## Skipped: tag \`$NEXT_VERSION\` already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger release build
        if: steps.tag.outputs.created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.next }}
        run: gh workflow run release.yml --ref "$TAG_NAME"
